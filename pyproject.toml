[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-bias-evaluation-platform"
version = "0.1.0"
description = "Automated Bias Evaluation Platform for Large Language Models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "textblob>=0.17.1",
  "datasets",
  "langchain",
  "langchain-openai",
  "langchain-google-genai",
  "streamlit",
  "plotly",
  "schedule",
  "transformers>=4.30.0",
  "openai",
  "google-generativeai",
]

